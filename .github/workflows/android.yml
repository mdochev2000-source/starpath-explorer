name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Сложи играта в приложението
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Сглоби APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Преименувай
        run: cp android/app/build/outputs/apk/release/app-release.apk Starpath-Explorer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Starpath-Explorer-apk
          path: Starpath-Explorer.apk
      - name: Публикувай за изтегляне
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Starpath Explorer 1.0.${{ github.run_number }}
          body: Изтегли Starpath-Explorer.apk на телефона и го инсталирай.
          files: Starpath-Explorer.apk
          make_latest: true
